name: Bug Report
description: Report a bug in the project
title: "[BUG] "
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the template below to help us understand and resolve the issue.

  - type: input
    id: library_version
    attributes:
      label: Library Version
      description: Specify the version of @svelte-safe-html/core you are using.
      placeholder: "e.g., 1.0.6"
    validations:
      required: true

  - type: dropdown
    id: svelte_version
    attributes:
      label: Svelte Version
      description: Specify the version of Svelte you are using.
      multiple: false
      options:
        - Svelte 3.x
        - Svelte 4.x
        - Svelte 5.x (Legacy Mode)
        - Svelte 5.x (Runes Mode)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Reproduction / Steps
      description: Please provide a code snippet or steps to reproduce the behavior.
      placeholder: |
        1. Import the library
        2. Pass this specific string: "..."
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs Actual Behavior
      description: Describe what you expected to happen versus what actually happened.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Browser, Node version, etc.
      placeholder: "e.g., Windows 10, Chrome 89, Node 20"
    validations:
      required: false